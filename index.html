<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TimeWalk 試作</title>
<!--
  TimeWalk 試作：先人が立った場所で、昔の景色を旅する。
  旅の地図：古写真の場所が点で並び、選んだ場所の ①②③ に進む
  ① 立つ：古写真を撮った場所（先人が立った場所）まで、距離と方向で案内
  ② 覗く：画面いっぱいのカメラ＋古写真（まるごと・加工なし）で見比べる。向きと傾きの合わせ方も案内
  ③ 残す：昔と今を横に並べた1枚を保存・共有
  日本語／英語の切り替えあり。場所の情報は SPOTS（スポット表）に1件ずつ持つ。
  使っているもの：ブラウザ標準の機能＋地図の部品 Leaflet（地図データ OpenStreetMap）。位置と映像は外へ送らない。
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --indigo: #3D5A80;
    --navy: #1C3A6B;   /* 発表スライドの見出し帯と同じ色（BOSS 11/3「添付画像に合わせて」）。ヘッダーとフッター */
    --brown: #8B6B4A;
    --bg: #F5F0E8;
    --card: #FFFFFF;
    --text: #2A2A2A;
    --muted: #6B6B6B;
    --warn: #B0442C;
    --teal: #2A9D8F;
    --coral: #E07A5F;
    --gold: #E9A23B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    line-height: 1.6;
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;   /* フッターを画面の下端まで */
  }
  body > main { flex: 1 0 auto; width: 100%; }
  header {
    background: var(--navy);
    color: #fff;
    padding: 14px 16px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .05em; }
  header p { margin: 2px 0 0; font-size: 14px; opacity: .9; }
  #langBtn {
    width: auto; margin: 0; padding: 6px 12px; font-size: 13px; font-weight: 700;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.5); border-radius: 18px;
    white-space: nowrap;
  }
  main { padding: 16px; max-width: 480px; margin: 0 auto; }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 18px 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .label { font-size: 13px; color: var(--muted); margin: 0; }
  .big {
    font-size: 52px;
    font-weight: 700;
    color: var(--indigo);
    margin: 4px 0 0;
    line-height: 1.1;
  }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #EEE7DC; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row span:last-child { font-weight: 600; }
  button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    background: var(--indigo);
    color: #fff;
    margin-bottom: 10px;
  }
  button.secondary { background: #fff; color: var(--brown); border: 2px solid var(--brown); font-size: 15px; padding: 12px; }
  .msg { font-size: 14px; color: var(--warn); margin: 0 0 10px; }
  .hidden { display: none !important; }
  /* 古写真の明るさ（BOSS 11/9「写真が暗くてわかりずらい。もう少し明るくならんか」）。画像そのものは変えず、見せ方だけ */
  .bri1 #old, .bri1 #pip, .bri1 #zoomImg, .bri1 #galTrack img, .bri1 .phCard img { filter: brightness(1.2) contrast(0.85); }
  .bri2 #old, .bri2 #pip, .bri2 #zoomImg, .bri2 #galTrack img, .bri2 .phCard img { filter: brightness(1.45) contrast(0.7); }
  .briBtn { width: auto; display: inline-block; margin: 6px 0; padding: 6px 14px; font-size: 14px; border-radius: 18px; background: #fff; color: var(--indigo); border: 1.5px solid var(--indigo); }
  #view .briBtn { position: absolute; right: 12px; top: calc(64px + env(safe-area-inset-top)); margin: 0; background: rgba(0,0,0,.55); color: #fff; border-color: #fff; z-index: 3; }
  #zoomBar .briBtn { margin: 0 0 0 10px; background: rgba(0,0,0,.55); color: #fff; border-color: #fff; }
  /* 画面の切り替え（BOSS 11/3「TOPページ…シンプルで使いやすいものに」） */
  .back { display: inline-block; width: auto; margin: 0 0 10px; padding: 8px 14px; font-size: 15px;
          background: transparent; color: var(--indigo, #3D5A80); border: 1px solid currentColor; border-radius: 20px; }
  .scrTitle { margin: 4px 0 6px; font-size: 20px; }
  .topBtn { margin-left: 6px; }
  header h1 { cursor: pointer; }
  /* どこへ行こう？：地域ボタンと短い一覧 */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; -webkit-overflow-scrolling: touch; }
  .chip { flex: none; width: auto; margin: 0; padding: 6px 12px; font-size: 14px; border-radius: 16px; background: #fff; color: var(--indigo); border: 1.5px solid var(--indigo); }
  .chip.on { background: var(--indigo); color: #fff; }
  .areaHead { font-size: 16px; color: var(--navy); margin: 14px 0 4px; border-bottom: 2px solid var(--navy); padding-bottom: 2px; }
  #spotList .item { padding: 8px; margin: 0 0 6px; }
  #spotList .item .cr { display: block; font-size: 11px; line-height: 1.4; }
  /* 場所の説明 */
  #placeTags { display: block; background: none; box-shadow: none; padding: 0; margin: 0 0 8px; }
  .phCard { background: var(--card); border-radius: 12px; padding: 8px; margin: 0 0 10px; }
  .phCard img { width: 100%; height: auto; border-radius: 6px; display: block; background: #EEE7DC; cursor: zoom-in; }
  .phCard p { margin: 6px 0 0; font-size: 13px; }
  .phCard .cr { font-size: 11px; color: var(--muted); }

  /* 旅の入口：2つの使い方 */
  .modes { display: flex; gap: 8px; margin: 4px 0 10px; }
  .mode {
    flex: 1; margin: 0; padding: 10px 8px; font-size: 15px; line-height: 1.35;
    background: #fff; color: var(--indigo); border: 2px solid var(--indigo);
  }
  .mode small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .mode.on { background: var(--indigo); color: #fff; }
  .mode.on small { color: rgba(255,255,255,.85); }
  /* 場所の一覧（写真つき） */
  #spotList { margin: 4px 0 10px; }
  .item {
    display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 12px;
    padding: 8px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer;
  }
  .item.soon { opacity: .7; }
  .item .thumb { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 8px; background: #EEE7DC; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .item .thumb img { max-width: 64px; max-height: 64px; width: auto; height: auto; }
  .item b { display: block; font-size: 15px; color: var(--text); }
  .item span { font-size: 12px; color: var(--muted); }
  .item .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-right: 6px; color: #fff; background: var(--teal); }
  .item.soon .tag { background: #9AA3AD; }
  .item .tag.gone, .pop .gone b { background: #8B6B4A; }
  .goneNote { margin: 10px 0 0; padding: 8px 10px; border-left: 4px solid #8B6B4A; background: rgba(139,107,74,.10); font-size: 14px; line-height: 1.6; }
  .goneNote b { display: inline-block; font-size: 11px; color: #fff; background: #8B6B4A; border-radius: 10px; padding: 0 8px; margin-right: 6px; }
  #gallery .goneNote { color: #eee; background: rgba(139,107,74,.35); }
  #viewGone { display: block; margin: 0 0 6px; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000; }
  #viewGone:empty { display: none; }
  .item .stamp { display: inline-block; font-size: 11px; padding: 0 6px; margin-right: 6px; color: #C0392B; border: 1.5px solid #C0392B; border-radius: 4px; font-weight: 700; }
  #stampMsg { font-size: 14px; color: #C0392B; font-weight: 700; }
  #stampMsg.miss { color: var(--muted); font-weight: 400; }
  #walkBox { background: var(--card, #fff); border: 1px solid #E5DccF; border-left: 4px solid #C0392B; border-radius: 10px; padding: 8px 12px; margin: 0 0 10px; font-size: 13px; color: var(--text); }
  #walkBox b { font-size: 15px; }
  /* 散歩を始める／記録（BOSS 11/3 4画面案） */
  #walkBar { display: flex; gap: 8px; margin: 4px 0 8px; }
  #walkBar #walkBtn { flex: 1; margin: 0; background: #C0392B; }
  #walkBar #walkBtn.on { background: #fff; color: #C0392B; border: 2px solid #C0392B; }
  #walkBar #logBtn { flex: 0 0 96px; margin: 0; background: #fff; color: var(--indigo); border: 2px solid var(--indigo); }
  #walkNow { margin: 0 0 8px; padding: 8px 12px; border-left: 4px solid #C0392B; background: var(--card, #fff); border-radius: 8px; font-size: 14px; }
  .logItem { background: var(--card, #fff); border-radius: 10px; padding: 10px 12px; margin: 0 0 8px; }
  .logItem b { display: block; font-size: 15px; color: var(--navy); }
  .logItem ol { margin: 4px 0 0; padding-left: 20px; font-size: 13px; }
  /* 地図：スマホでは1本指はページを送る。地図は2本指で動かす（BOSS 11/3「地図も下にいってしまいやすい」） */
  .mapHint { position: absolute; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
             background: rgba(0,0,0,.45); color: #fff; font-size: 16px; font-weight: bold; pointer-events: none;
             opacity: 0; transition: opacity .2s; }
  .mapHint.show { opacity: 1; }
  #wakeRow { font-size: 13px; color: var(--muted); margin: 6px 0 0; display: flex; align-items: center; gap: 8px; }
  #wakeRow button { width: auto; padding: 4px 12px; font-size: 13px; margin: 0; }
  #walkBox small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  #walkBox ol { margin: 4px 0 0; padding-left: 20px; }
  #map { height: 40vh; min-height: 280px; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-bottom: 8px; }
  .legend { font-size: 12px; color: var(--muted); margin: 0 0 6px; display: flex; gap: 14px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .pop b { font-size: 15px; }
  /* 近くにある？：近い場所を古写真の丸いアイコンで（BOSS 11/3「古写真をアイコンにして地図上に表記」） */
  .phIcon { width: 52px; height: 52px; border-radius: 50%; background: #ddd center/cover no-repeat;
            border: 3px solid #2A9D8F; box-shadow: 0 2px 6px rgba(0,0,0,.45); }
  .phIcon.soon { border-color: #9AA3AD; }
  /* 地図を動かしたら「このエリアから探す」（BOSS 11/9） */
  #areaSearch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000; width: auto; margin: 0;
                padding: 8px 16px; font-size: 14px; border-radius: 20px; background: #fff; color: var(--navy); border: 2px solid var(--navy);
                box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .phIcon.stamped { border-color: #C0392B; }
  .pop p { margin: 4px 0 8px; font-size: 13px; color: var(--muted); }
  .pop img { display: block; max-width: 180px; max-height: 120px; width: auto; height: auto; margin: 4px 0; border-radius: 4px; }
  .pop button { font-size: 14px; padding: 8px 10px; margin: 0; }
  #chosen { font-size: 15px; font-weight: 700; color: var(--indigo); margin: 0 0 4px; }

  /* ①②③ の見出し */
  .step { display: flex; align-items: center; gap: 10px; margin: 26px 0 4px; }
  .step .num {
    width: 34px; height: 34px; border-radius: 50%; color: #fff;
    font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .step h2 { margin: 0; font-size: 24px; }
  .step.s1 .num { background: var(--teal); }  .step.s1 h2 { color: var(--teal); }
  .step.s2 .num { background: var(--coral); } .step.s2 h2 { color: var(--coral); }
  .step.s3 .num { background: var(--gold); }  .step.s3 h2 { color: var(--gold); }
  .lead { margin: 0 0 10px; font-weight: 700; font-size: 16px; }
  .lead small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }

  /* ① 立つ：方向の矢印と案内 */
  .dirRow { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  #arrow { width: 56px; height: 56px; flex: 0 0 56px; transition: transform .25s ease-out; }
  #dirText { font-size: 17px; font-weight: 700; color: var(--indigo); margin: 0; }
  #dirSub { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
  #miniMap { height: 240px; border-radius: 10px; overflow: hidden; margin-top: 12px; }
  .destLabel { background: #E07A5F; color: #fff; border: none; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .destLabel::before { display: none; }
  #status { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; font-weight: 700; font-size: 16px; display: none; }
  #status.near { display: block; background: #FFF4E0; color: #9A5B00; }
  #status.here { display: block; background: #E3F4F1; color: #1C6E64; }
  .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  details { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
  details summary { cursor: pointer; padding: 6px 0; }

  /* ② 覗く：古写真の見本（切らずに全体） */
  .photo { padding: 12px; margin-bottom: 10px; }
  .photo img { display: block; max-width: 100%; max-height: 33vh; width: auto; height: auto; margin: 6px auto 0; border-radius: 6px; }
  #picker { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0 0; }
  #picker .pk { width: auto; flex: 0 0 auto; margin: 0; padding: 4px; background: #fff; border: 2px solid #ddd; border-radius: 8px; color: var(--text); font-size: 11px; font-weight: 400; }
  #picker .pk.on { border-color: var(--coral); }
  #picker .pk img { display: block; height: 48px; width: auto; max-width: 90px; margin: 0 auto 2px; }
  .credit { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
  .credit a { color: var(--indigo); }

  /* 全画面の覗く画面 */
  #view { position: fixed; inset: 0; background: #000; z-index: 1000; }
  #view .big { position: absolute; inset: 0; width: 100%; height: 100%; }
  #view video.big { object-fit: cover; }
  #view img.big { object-fit: contain; background: #000; }
  #view .small {
    position: absolute; right: 12px;
    bottom: calc(130px + env(safe-area-inset-bottom));
    width: 38vw; max-height: 34vh;
    border: 3px solid #fff; border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.5); background: #000; z-index: 2;
  }
  #view img.small { object-fit: contain; height: auto; }
  #view video.small { object-fit: cover; height: 34vh; }
  #view .small { touch-action: none; }
  /* 文字や案内をまとめた層。スマホを横に持ったら、この層だけ90°回して横向きで読めるようにする */
  #hud { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #hud #tip { pointer-events: none; }
  /* 小さい窓の右下の角：引っぱって大きさを変える */
  #rsz { position: absolute; width: 34px; height: 34px; margin: 0; padding: 0; border-radius: 50%;
         background: #fff; color: #3D5A80; font-size: 18px; line-height: 34px; text-align: center;
         box-shadow: 0 1px 6px rgba(0,0,0,.5); z-index: 4; touch-action: none; user-select: none; -webkit-user-select: none; }
  #close {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 44px; height: 44px; padding: 0; margin: 0;
    border-radius: 50%; font-size: 26px; line-height: 44px;
    background: rgba(0,0,0,.55); color: #fff; z-index: 3;
  }
  #tip {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 66px; right: 12px;
    margin: 0; color: #fff; font-size: 13px; line-height: 1.4; text-shadow: 0 1px 3px #000; z-index: 3;
  }
  /* 向き・傾きの合わせ方（覗く画面の左下） */
  #aim {
    position: absolute; left: 12px; bottom: calc(130px + env(safe-area-inset-bottom));
    max-width: calc(62vw - 30px);
    background: rgba(0,0,0,.55); color: #fff; border-radius: 10px;
    padding: 8px 10px; font-size: 13px; line-height: 1.5; z-index: 3;
  }
  #aim b.ok { color: #8FE3C9; }
  #shutter {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(40px + env(safe-area-inset-bottom));
    width: 72px; height: 72px; padding: 0; margin: 0;
    border-radius: 50%; background: #fff;
    border: 5px solid rgba(255,255,255,.5); background-clip: padding-box;
    box-shadow: 0 0 0 3px #fff; z-index: 3;
  }
  #viewCredit {
    position: absolute; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom));
    margin: 0; color: #eee; font-size: 11px; text-shadow: 0 1px 3px #000; z-index: 3;
  }
  /* 写真を見る画面：その場所の古写真を左右にめくって見る */
  #gallery { position: fixed; inset: 0; background: #111; z-index: 1100; display: flex; flex-direction: column; }
  #gallery.hidden { display: none; }
  #galTop { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 8px; color: #fff; }
  #galTop b { flex: 1; font-size: 16px; }
  #galClose { width: 44px; height: 44px; padding: 0; margin: 0; border-radius: 50%; font-size: 26px; line-height: 44px; background: rgba(255,255,255,.15); color: #fff; flex: 0 0 44px; }
  #galCount { font-size: 13px; color: #ccc; }
  #galTrack { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .galPage { flex: 0 0 100%; scroll-snap-align: center; display: flex; flex-direction: column; padding: 0 12px; box-sizing: border-box; min-height: 0; }
  .galPage img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
  .galPage .cap { color: #eee; font-size: 12px; line-height: 1.5; margin: 8px 0 0; }
  .galPage .cap a { color: #9cc9ff; }
  .galPage button { margin: 10px 0 calc(14px + env(safe-area-inset-bottom)); }
  .galPage img { cursor: zoom-in; }
  .galZoomHint { color: #bbb; font-size: 11px; text-align: center; margin: 4px 0 0; }
  /* 拡大画面：2本指で広げる・ダブルタップ・＋−ボタン・指でずらす（写真そのものは切らない） */
  #zoom { position: fixed; inset: 0; background: #000; z-index: 1200; overflow: hidden; touch-action: none; }
  #zoom.hidden { display: none; }
  #zoomImg { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
  #zoomBar { position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 12px; z-index: 2; }
  #zoomBar button, #zoomClose { width: 48px; height: 48px; padding: 0; margin: 0; border-radius: 50%; font-size: 24px; line-height: 48px; background: rgba(255,255,255,.2); color: #fff; }
  #zoomClose { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 2; }
  #zoomPct { color: #fff; font-size: 13px; align-self: center; min-width: 48px; text-align: center; }
  .galBtn { display: inline-block; width: auto; margin: 6px 0 0; padding: 6px 12px; font-size: 13px; }
  /* ③ 残す：撮った1枚の確認画面 */
  #shot {
    position: fixed; inset: 0; z-index: 1001; overflow-y: auto;
    background: var(--bg); padding: calc(16px + env(safe-area-inset-top)) 16px 24px;
  }
  #shot .shotTitle { font-size: 18px; font-weight: 700; color: var(--indigo); margin: 0 0 10px; }
  #shotImg { display: block; width: 100%; height: auto; border-radius: 8px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  #saveHint { font-size: 13px; color: var(--muted); }
  footer { font-size: 12px; color: #DCE3EE; background: var(--navy); text-align: center; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  /* 横持ち：シャッターは右の真ん中（カメラアプリと同じ）、小さい写真は高さで大きさを決める */
  @media (orientation: landscape) {
    #shutter { left: auto; right: calc(20px + env(safe-area-inset-right)); top: 50%; bottom: auto; transform: translateY(-50%); }
    #view .small { right: calc(110px + env(safe-area-inset-right)); bottom: 40px; max-height: 50vh; max-width: 45vw; }
    #view img.small { width: auto; height: 50vh; }
    #view video.small { width: 34vw; height: 50vh; }
    #aim { bottom: 40px; max-width: 34vw; }
    #viewCredit { right: calc(110px + env(safe-area-inset-right)); }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>TimeWalk</h1>
    <p data-t="tagline"></p>
  </div>
  <button id="langBtn" type="button">English</button>
</header>

<main>
  <!-- 画面1：ホーム（地図と2つの入口） -->
  <section id="scrHome" class="scr">
  <!-- 旅の入口：2つの使い方「どこへ行こう？」「近くにある？」 -->
  <div class="modes">
    <button id="modePlan" class="mode" type="button"><span data-t="modePlan"></span><small data-t="modePlanSub"></small></button>
    <button id="modeNear" class="mode" type="button"><span data-t="modeNear"></span><small data-t="modeNearSub"></small></button>
  </div>
  <div id="map"></div>
  <p class="legend"><span><i style="background:#2A9D8F"></i><span data-t="legendReady"></span></span><span><i style="background:#9AA3AD"></i><span data-t="legendSoon"></span></span><span><i style="background:#3B82F6"></i><span data-t="legendYou"></span></span></p>
  <p id="nearMsg" class="note hidden"></p>
  <div id="nearList"></div>
  <div id="walkBar">
    <button id="walkBtn" type="button"></button>
    <button id="logBtn" type="button" data-t="logBtn"></button>
  </div>
  <p id="walkNow" class="hidden"></p>
  </section>

  <!-- 画面4：散歩の記録（スマホの中だけに保存） -->
  <section id="scrLog" class="scr hidden">
  <button class="back" type="button" data-t="back"></button>
  <h2 class="scrTitle" data-t="logTitle"></h2>
  <p id="logSum" class="note"></p>
  <div id="logList"></div>
  <p class="note" data-t="logPrivacy"></p>
  </section>

  <!-- 画面2：どこへ行こう？（場所の一覧） -->
  <section id="scrPlaces" class="scr hidden">
  <button class="back" type="button" data-t="back"></button>
  <h2 class="scrTitle" data-t="modePlan"></h2>
  <p id="listMsg" class="note"></p>
  <div id="areaChips" class="chips"></div>
  <div id="spotList"></div>
  </section>

  <!-- 画面2b：場所の説明 -->
  <section id="scrPlace" class="scr hidden">
  <button class="back" type="button" data-t="back"></button>
  <p id="placeArea" class="note"></p>
  <h2 class="scrTitle" id="placeName"></h2>
  <p id="placeTags" class="item"></p>
  <button class="briBtn" type="button"></button>
  <div id="placePhotos"></div>
  <div id="placeAbout"></div>
  <button id="placeGo" type="button" data-t="goThere"></button>
  </section>

  <!-- 画面3：立つ・覗く・残す -->
  <section id="scrSpot" class="scr hidden">
  <button class="back" type="button" data-t="back"></button>
  <p id="chosen"></p>

  <!-- ① 立つ -->
  <div class="step s1" id="stepStand"><span class="num">1</span><h2 data-t="s1"></h2></div>
  <p class="lead"><span data-t="s1Lead"></span><small data-t="s1Sub"></small></p>

  <button id="start" data-t="startBtn"></button>
  <p id="wakeRow" class="hidden"><span id="wakeText"></span><button id="wakeBtn" class="secondary" type="button"></button></p>
  <p id="msg" class="msg hidden"></p>

  <div class="card">
    <p class="label" id="toLabel"></p>
    <p class="big" id="dist">—</p>
    <div class="dirRow">
      <svg id="arrow" viewBox="0 0 56 56" aria-hidden="true">
        <circle cx="28" cy="28" r="26" fill="#EEF2F7"/>
        <path d="M28 8 L40 38 L28 31 L16 38 Z" fill="#3D5A80"/>
      </svg>
      <div>
        <p id="dirText"></p>
        <p id="dirSub"></p>
      </div>
    </div>
    <p id="status"></p>
    <div id="miniMap"></div>
    <p class="note" id="spotNote"></p>
  </div>

  <details>
    <summary data-t="detailsTitle"></summary>
    <div class="card">
      <div class="row"><span data-t="dAcc"></span><span id="acc">—</span></div>
      <div class="row"><span data-t="dDrift"></span><span id="drift">—</span></div>
      <div class="row"><span data-t="dCount"></span><span id="count">0</span></div>
      <div class="row"><span data-t="dTime"></span><span id="time">—</span></div>
      <div class="row"><span data-t="dCompass"></span><span id="compass">—</span></div>
      <div class="row"><span data-t="dTilt"></span><span id="tilt">—</span></div>
    </div>
    <button id="reset" class="secondary" data-t="resetBtn"></button>
  </details>

  <!-- ② 覗く -->
  <div class="step s2"><span class="num">2</span><h2 data-t="s2"></h2></div>
  <p class="lead"><span data-t="s2Lead"></span><small data-t="s2Sub"></small></p>

  <div class="card photo">
    <p class="label" data-t="oldPhoto"></p>
    <img id="old" alt="" crossorigin="anonymous">
    <button class="briBtn" type="button"></button>
    <div id="picker" class="hidden"></div>
    <p class="goneNote hidden" id="goneNote"></p>
    <p class="credit" id="credit"></p>
  </div>

  <button id="camStart" data-t="camBtn"></button>
  <p id="camMsg" class="msg hidden"></p>

  <!-- ③ 残す -->
  <div class="step s3"><span class="num">3</span><h2 data-t="s3"></h2></div>
  <p class="lead"><span data-t="s3Lead"></span><small data-t="s3Sub"></small></p>
  </section>
</main>

<!-- ② 覗く（全画面） -->
<div id="view" class="hidden">
  <video id="cam" playsinline muted autoplay></video>
  <img id="pip" alt="" crossorigin="anonymous">
  <div id="rsz" aria-label="resize">⤡</div>
  <button id="close" aria-label="close">×</button>
  <div id="hud">
    <p id="tip" data-t="viewTip"></p>
    <div id="aim"></div>
    <button class="briBtn" type="button"></button>
    <p id="viewCredit"><span id="viewGone"></span><span id="viewCreditText"></span></p>
  </div>
  <button id="shutter" aria-label="shutter"></button>
</div>

<!-- 写真を見る（その場所の古写真を全部） -->
<div id="gallery" class="hidden">
  <div id="galTop"><b id="galName"></b><span id="galCount"></span><button id="galClose" type="button" aria-label="close">×</button></div>
  <div id="galTrack"></div>
</div>

<!-- 古写真の拡大 -->
<div id="zoom" class="hidden">
  <img id="zoomImg" alt="">
  <button id="zoomClose" type="button" aria-label="close">×</button>
  <div id="zoomBar"><button id="zoomOut" type="button" aria-label="zoom out">−</button><span id="zoomPct"></span><button id="zoomIn" type="button" aria-label="zoom in">＋</button><button class="briBtn" type="button"></button></div>
</div>

<!-- ③ 残す：撮った1枚の確認と保存 -->
<div id="shot" class="hidden">
  <p class="shotTitle" data-t="shotTitle"></p>
  <img id="shotImg" alt="">
  <button id="saveBtn" data-t="saveBtn"></button>
  <button id="retake" class="secondary" data-t="retakeBtn"></button>
  <p id="saveHint" class="hidden" data-t="saveHint"></p>
  <p id="stampMsg" class="hidden"></p>
</div>

<footer data-t="footer"></footer>

  function addWalk(pos) {

    if (!walk.last) { walk.last = p; }
    else {

    const goneLines = lines.length;
    wrap("昔の写真：" + (p.credit || (p.title + " " + p.year + (p.by ? "・" + p.by : "") + "・" + p.holder + (p.id ? "（" + p.id + "）" : "")) ) + "・" + p.license);
    wrap("Old photo: " + (p.titleEn || p.title) + ", " + (p.yearEn || p.year) + ", " + (p.holderEn || p.holder) + " (" + p.license + ")");
    const need = top + H + 30 + lines.length * 36 + 20;
    if (need > c.height) {   // 出典が長い時は下の余白を広げて描き直す
      const img = x.getImageData(0, 0, c.width, top + H);
      c.height = need;
      x.fillStyle = "#F5F0E8"; x.fillRect(0, 0, c.width, c.height);
      x.putImageData(img, 0, 0);
      x.font = "24px " + font;
    }
    lines.forEach((ln, i) => { x.fillStyle = i < goneLines ? "#8B6B4A" : "#6B6B6B"; x.fillText(ln, pad, top + H + 50 + i * 36); });
    return c;
  }
  $("shutter").addEventListener("click", () => {
    if (!camStream || !$("cam").videoWidth) return;
    const c = makeComparison();
    $("shotImg").src = c.toDataURL("image/jpeg", 0.9);
    c.toBlob((b) => { shotBlob = b; }, "image/jpeg", 0.9);
    $("saveHint").classList.add("hidden");
    $("stampMsg").classList.add("hidden");
    $("shot").classList.remove("hidden");
  });
  $("retake").addEventListener("click", () => { $("shot").classList.add("hidden"); });
  // ===== スタンプ：③残すを、その場所から50m以内でしたときだけ押す（スマホの中だけに記録） =====
  function giveStamp() {
    const box = $("stampMsg");
    box.classList.remove("hidden", "miss");
    const n = pick(spot.name, spot.nameEn);
    if (stamps[spot.id]) { box.textContent = t("stampAgain", { d: stamps[spot.id].date }); return; }
    if (!here) { box.classList.add("miss"); box.textContent = t("stampNoPos"); return; }
    const d = distanceM(here, dest(spot));
    if (d > NEAR_M) { box.classList.add("miss"); box.textContent = t("stampFar", { m: fmt(d) }); return; }
    stamps[spot.id] = { date: today(), ts: Date.now(), photo: photoIdx, m: Math.round(d) };
    try { localStorage.setItem("tw-stamps", JSON.stringify(stamps)); } catch (e) {}
    box.textContent = t("stampGot", { n, c: Object.keys(stamps).length });
    renderList(); buildMarkers(); renderWalk();
    applyBri();
  }
  $("saveBtn").addEventListener("click", async () => {
    if (!shotBlob) return;
    const name = "timewalk-" + spot.id + "-" + new Date().toISOString().slice(0, 10) + ".jpg";
    const file = new File([shotBlob], name, { type: "image/jpeg" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "TimeWalk" });
        giveStamp();
        return;
      }
    } catch (e) { if (e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(shotBlob); a.download = name; a.click();
    $("saveHint").classList.remove("hidden");
    giveStamp();
  });

  // ===== はじめに =====
  initMap();
  setTimeout(uprightAll, 600);
  if (walkNow) startLocation();   // 散歩の途中で開き直したら、位置の計測を続ける   // 横倒しの写真を起こす（地図と一覧を出してから）
  applyLang();
  applyBri();   // 明るさボタンの文字と、前に選んだ明るさ
</script>
</body>
</html>
