<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TimeWalk 試作</title>
<!--
  TimeWalk 試作：先人が立った場所で、昔の景色を旅する。
  旅の地図：古写真の場所が点で並び、選んだ場所の ①②③ に進む
  ① 立つ：古写真を撮った場所（先人が立った場所）まで、距離と方向で案内
  ② 覗く：画面いっぱいのカメラ＋古写真（まるごと・加工なし）で見比べる。向きと傾きの合わせ方も案内
  ③ 残す：昔と今を横に並べた1枚を保存・共有
  日本語／英語の切り替えあり。場所の情報は SPOTS（スポット表）に1件ずつ持つ。
  使っているもの：ブラウザ標準の機能＋地図の部品 Leaflet（地図データ OpenStreetMap）。位置と映像は外へ送らない。
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --indigo: #3D5A80;
    --brown: #8B6B4A;
    --bg: #F5F0E8;
    --card: #FFFFFF;
    --text: #2A2A2A;
    --muted: #6B6B6B;
    --warn: #B0442C;
    --teal: #2A9D8F;
    --coral: #E07A5F;
    --gold: #E9A23B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    line-height: 1.6;
  }
  header {
    background: var(--indigo);
    color: #fff;
    padding: 14px 16px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .05em; }
  header p { margin: 2px 0 0; font-size: 14px; opacity: .9; }
  #langBtn {
    width: auto; margin: 0; padding: 6px 12px; font-size: 13px; font-weight: 700;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.5); border-radius: 18px;
    white-space: nowrap;
  }
  main { padding: 16px; max-width: 480px; margin: 0 auto; }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 18px 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .label { font-size: 13px; color: var(--muted); margin: 0; }
  .big {
    font-size: 52px;
    font-weight: 700;
    color: var(--indigo);
    margin: 4px 0 0;
    line-height: 1.1;
  }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #EEE7DC; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row span:last-child { font-weight: 600; }
  button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    background: var(--indigo);
    color: #fff;
    margin-bottom: 10px;
  }
  button.secondary { background: #fff; color: var(--brown); border: 2px solid var(--brown); font-size: 15px; padding: 12px; }
  .msg { font-size: 14px; color: var(--warn); margin: 0 0 10px; }
  .hidden { display: none !important; }

  /* 旅の入口：2つの使い方 */
  .modes { display: flex; gap: 8px; margin: 4px 0 10px; }
  .mode {
    flex: 1; margin: 0; padding: 10px 8px; font-size: 15px; line-height: 1.35;
    background: #fff; color: var(--indigo); border: 2px solid var(--indigo);
  }
  .mode small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .mode.on { background: var(--indigo); color: #fff; }
  .mode.on small { color: rgba(255,255,255,.85); }
  /* 場所の一覧（写真つき） */
  #spotList { margin: 4px 0 10px; }
  .item {
    display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 12px;
    padding: 8px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer;
  }
  .item.soon { opacity: .7; }
  .item .thumb { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 8px; background: #EEE7DC; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .item .thumb img { max-width: 64px; max-height: 64px; width: auto; height: auto; }
  .item b { display: block; font-size: 15px; color: var(--text); }
  .item span { font-size: 12px; color: var(--muted); }
  .item .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-right: 6px; color: #fff; background: var(--teal); }
  .item.soon .tag { background: #9AA3AD; }
  #map { height: 40vh; min-height: 280px; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-bottom: 8px; }
  .legend { font-size: 12px; color: var(--muted); margin: 0 0 6px; display: flex; gap: 14px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .pop b { font-size: 15px; }
  .pop p { margin: 4px 0 8px; font-size: 13px; color: var(--muted); }
  .pop img { display: block; max-width: 180px; max-height: 120px; width: auto; height: auto; margin: 4px 0; border-radius: 4px; }
  .pop button { font-size: 14px; padding: 8px 10px; margin: 0; }
  #chosen { font-size: 15px; font-weight: 700; color: var(--indigo); margin: 0 0 4px; }

  /* ①②③ の見出し */
  .step { display: flex; align-items: center; gap: 10px; margin: 26px 0 4px; }
  .step .num {
    width: 34px; height: 34px; border-radius: 50%; color: #fff;
    font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .step h2 { margin: 0; font-size: 24px; }
  .step.s1 .num { background: var(--teal); }  .step.s1 h2 { color: var(--teal); }
  .step.s2 .num { background: var(--coral); } .step.s2 h2 { color: var(--coral); }
  .step.s3 .num { background: var(--gold); }  .step.s3 h2 { color: var(--gold); }
  .lead { margin: 0 0 10px; font-weight: 700; font-size: 16px; }
  .lead small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }

  /* ① 立つ：方向の矢印と案内 */
  .dirRow { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  #arrow { width: 56px; height: 56px; flex: 0 0 56px; transition: transform .25s ease-out; }
  #dirText { font-size: 17px; font-weight: 700; color: var(--indigo); margin: 0; }
  #dirSub { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
  #status { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; font-weight: 700; font-size: 16px; display: none; }
  #status.near { display: block; background: #FFF4E0; color: #9A5B00; }
  #status.here { display: block; background: #E3F4F1; color: #1C6E64; }
  .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  details { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
  details summary { cursor: pointer; padding: 6px 0; }

  /* ② 覗く：古写真の見本（切らずに全体） */
  .photo { padding: 12px; margin-bottom: 10px; }
  .photo img { display: block; max-width: 100%; max-height: 33vh; width: auto; height: auto; margin: 6px auto 0; border-radius: 6px; }
  #picker { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0 0; }
  #picker .pk { width: auto; flex: 0 0 auto; margin: 0; padding: 4px; background: #fff; border: 2px solid #ddd; border-radius: 8px; color: var(--text); font-size: 11px; font-weight: 400; }
  #picker .pk.on { border-color: var(--coral); }
  #picker .pk img { display: block; height: 48px; width: auto; max-width: 90px; margin: 0 auto 2px; }
  .credit { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
  .credit a { color: var(--indigo); }

  /* 全画面の覗く画面 */
  #view { position: fixed; inset: 0; background: #000; z-index: 1000; }
  #view .big { position: absolute; inset: 0; width: 100%; height: 100%; }
  #view video.big { object-fit: cover; }
  #view img.big { object-fit: contain; background: #000; }
  #view .small {
    position: absolute; right: 12px;
    bottom: calc(130px + env(safe-area-inset-bottom));
    width: 38vw; max-height: 34vh;
    border: 3px solid #fff; border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.5); background: #000; z-index: 2;
  }
  #view img.small { object-fit: contain; height: auto; }
  #view video.small { object-fit: cover; height: 34vh; }
  #close {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 44px; height: 44px; padding: 0; margin: 0;
    border-radius: 50%; font-size: 26px; line-height: 44px;
    background: rgba(0,0,0,.55); color: #fff; z-index: 3;
  }
  #tip {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 66px; right: 12px;
    margin: 0; color: #fff; font-size: 13px; line-height: 1.4; text-shadow: 0 1px 3px #000; z-index: 3;
  }
  /* 向き・傾きの合わせ方（覗く画面の左下） */
  #aim {
    position: absolute; left: 12px; bottom: calc(130px + env(safe-area-inset-bottom));
    max-width: calc(62vw - 30px);
    background: rgba(0,0,0,.55); color: #fff; border-radius: 10px;
    padding: 8px 10px; font-size: 13px; line-height: 1.5; z-index: 3;
  }
  #aim b.ok { color: #8FE3C9; }
  #shutter {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(40px + env(safe-area-inset-bottom));
    width: 72px; height: 72px; padding: 0; margin: 0;
    border-radius: 50%; background: #fff;
    border: 5px solid rgba(255,255,255,.5); background-clip: padding-box;
    box-shadow: 0 0 0 3px #fff; z-index: 3;
  }
  #viewCredit {
    position: absolute; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom));
    margin: 0; color: #eee; font-size: 11px; text-shadow: 0 1px 3px #000; z-index: 3;
  }
  /* ③ 残す：撮った1枚の確認画面 */
  #shot {
    position: fixed; inset: 0; z-index: 1001; overflow-y: auto;
    background: var(--bg); padding: calc(16px + env(safe-area-inset-top)) 16px 24px;
  }
  #shot .shotTitle { font-size: 18px; font-weight: 700; color: var(--indigo); margin: 0 0 10px; }
  #shotImg { display: block; width: 100%; height: auto; border-radius: 8px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  #saveHint { font-size: 13px; color: var(--muted); }
  footer { font-size: 12px; color: var(--muted); text-align: center; padding: 8px 16px 24px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>TimeWalk</h1>
    <p data-t="tagline"></p>
  </div>
  <button id="langBtn" type="button">English</button>
</header>

<main>
  <!-- 旅の入口：2つの使い方「どこへ行こう？」「近くにある？」 -->
  <div class="modes">
    <button id="modePlan" class="mode on" type="button"><span data-t="modePlan"></span><small data-t="modePlanSub"></small></button>
    <button id="modeNear" class="mode" type="button"><span data-t="modeNear"></span><small data-t="modeNearSub"></small></button>
  </div>
  <div id="map"></div>
  <p class="legend"><span><i style="background:#2A9D8F"></i><span data-t="legendReady"></span></span><span><i style="background:#9AA3AD"></i><span data-t="legendSoon"></span></span><span><i style="background:#3B82F6"></i><span data-t="legendYou"></span></span></p>
  <p id="listMsg" class="note"></p>
  <div id="spotList"></div>
  <p id="chosen"></p>

  <!-- ① 立つ -->
  <div class="step s1" id="stepStand"><span class="num">1</span><h2 data-t="s1"></h2></div>
  <p class="lead"><span data-t="s1Lead"></span><small data-t="s1Sub"></small></p>

  <button id="start" data-t="startBtn"></button>
  <p id="msg" class="msg hidden"></p>

  <div class="card">
    <p class="label" id="toLabel"></p>
    <p class="big" id="dist">—</p>
    <div class="dirRow">
      <svg id="arrow" viewBox="0 0 56 56" aria-hidden="true">
        <circle cx="28" cy="28" r="26" fill="#EEF2F7"/>
        <path d="M28 8 L40 38 L28 31 L16 38 Z" fill="#3D5A80"/>
      </svg>
      <div>
        <p id="dirText"></p>
        <p id="dirSub"></p>
      </div>
    </div>
    <p id="status"></p>
    <p class="note" id="spotNote"></p>
  </div>

  <details>
    <summary data-t="detailsTitle"></summary>
    <div class="card">
      <div class="row"><span data-t="dAcc"></span><span id="acc">—</span></div>
      <div class="row"><span data-t="dDrift"></span><span id="drift">—</span></div>
      <div class="row"><span data-t="dCount"></span><span id="count">0</span></div>
      <div class="row"><span data-t="dTime"></span><span id="time">—</span></div>
      <div class="row"><span data-t="dCompass"></span><span id="compass">—</span></div>
      <div class="row"><span data-t="dTilt"></span><span id="tilt">—</span></div>
    </div>
    <button id="reset" class="secondary" data-t="resetBtn"></button>
  </details>

  <!-- ② 覗く -->
  <div class="step s2"><span class="num">2</span><h2 data-t="s2"></h2></div>
  <p class="lead"><span data-t="s2Lead"></span><small data-t="s2Sub"></small></p>

  <div class="card photo">
    <p class="label" data-t="oldPhoto"></p>
    <img id="old" alt="" crossorigin="anonymous">
    <div id="picker" class="hidden"></div>
    <p class="credit" id="credit"></p>
  </div>

  <button id="camStart" data-t="camBtn"></button>
  <p id="camMsg" class="msg hidden"></p>

  <!-- ③ 残す -->
  <div class="step s3"><span class="num">3</span><h2 data-t="s3"></h2></div>
  <p class="lead"><span data-t="s3Lead"></span><small data-t="s3Sub"></small></p>
</main>

<!-- ② 覗く（全画面） -->
<div id="view" class="hidden">
  <video id="cam" playsinline muted autoplay></video>
  <img id="pip" alt="" crossorigin="anonymous">
  <button id="close" aria-label="close">×</button>
  <p id="tip" data-t="viewTip"></p>
  <div id="aim"></div>
  <button id="shutter" aria-label="shutter"></button>
  <p id="viewCredit"></p>
</div>

<!-- ③ 残す：撮った1枚の確認と保存 -->
<div id="shot" class="hidden">
  <p class="shotTitle" data-t="shotTitle"></p>
  <img id="shotImg" alt="">
  <button id="saveBtn" data-t="saveBtn"></button>
  <button id="retake" class="secondary" data-t="retakeBtn"></button>
  <p id="saveHint" class="hidden" data-t="saveHint"></p>
</div>

<footer data-t="footer"></footer>

    a.href = p.page; a.target = "_blank"; a.rel = "noopener"; a.textContent = t("seeSource");
    c.append(a);
    $("viewCredit").textContent = t("oldPhotoCap") + ": " + pick(p.title, p.titleEn) + " (" + pick(p.year, p.yearEn) + ") " + pick(p.holder, p.holderEn) + " · " + p.license;
    if (here) render();
    renderAim();
  }
  // 写真が複数ある場所：どの古写真で覗くかを選ぶ
  function renderPicker(list) {
    const box = $("picker");
    box.innerHTML = "";
    if (list.length < 2) { box.classList.add("hidden"); return; }
    box.classList.remove("hidden");
    list.forEach((ph, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pk" + (i === photoIdx ? " on" : "");
      const im = document.createElement("img"); im.src = ph.thumb || ph.src; im.alt = "";
      const tx = document.createElement("span"); tx.textContent = pick(ph.year, ph.yearEn);
      b.append(im, tx);
      b.addEventListener("click", () => applySpot(spot, i));
      box.append(b);
    });
  }

  // ===== 旅の地図 =====
  let map = null, markerLayer = null, youMarker = null;
  function initMap() {
    if (typeof window.L === "undefined") { $("map").textContent = "地図を読み込めませんでした / Map failed to load"; return; }
    map = window.L.map("map", { zoomControl: true, attributionControl: true }).setView([35.3190, 139.5480], 13);
    window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    markerLayer = window.L.layerGroup().addTo(map);
    buildMarkers();
    const all = SPOTS.concat(SOON).map((s) => [s.target.lat, s.target.lon]);
    if (all.length > 1) map.fitBounds(all, { padding: [30, 30], maxZoom: 15 });
  }
  function dot(color, r) {
    return window.L.divIcon({
      className: "",
      html: '<div style="width:' + r * 2 + 'px;height:' + r * 2 + 'px;border-radius:50%;background:' + color + ';border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',
      iconSize: [r * 2 + 6, r * 2 + 6], iconAnchor: [r + 3, r + 3]
    });
  }
  function buildMarkers() {
    if (!map) return;
    markerLayer.clearLayers();
    SPOTS.concat(SOON).forEach((s) => {
      const ready = !!s.ready;
      const m = window.L.marker([s.target.lat, s.target.lon], { icon: dot(ready ? "#2A9D8F" : "#9AA3AD", ready ? 10 : 7) });
      const box = document.createElement("div");
      box.className = "pop";
      const b = document.createElement("b"); b.textContent = pick(s.name, s.nameEn); box.append(b);
      (s.photos || (s.photo ? [s.photo] : [])).slice(0, 3).forEach((ph) => {
        const img = document.createElement("img"); img.src = ph.thumb || ph.src; img.alt = ""; img.loading = "lazy"; box.append(img);
        const cr = document.createElement("p");
        cr.style.fontSize = "11px"; cr.style.margin = "0 0 6px";
        cr.textContent = pick(ph.year, ph.yearEn) + " · " + pick(ph.holder, ph.holderEn) + " · " + ph.license;
        box.append(cr);
      });
      if (!ready) { const p = document.createElement("p"); p.textContent = t("soonText"); box.append(p); }
      const btn = document.createElement("button");
      btn.textContent = t("goHere");
      btn.addEventListener("click", () => chooseSpot(s));
      box.append(btn);
      m.bindPopup(box).addTo(markerLayer);
      markersById[s.id] = m;
    });
  }

  // ===== 旅の入口：2つの使い方と場所の一覧 =====
  // どこへ行こう？＝全部の場所を見て旅を考える（体験できる場所が先）
  // 近くにある？  ＝今いる場所から近い順
  let mode = "plan";
  const markersById = {};
  function chooseSpot(s) {
    applySpot(s);
    if (map) map.closePopup();
    $("stepStand").scrollIntoView({ behavior: "smooth" });
  }
  function renderList() {
    const all = SPOTS.concat(SOON);
    const items = all.map((s) => ({ s, d: here ? distanceM(here, s.standAt || s.target) : null }));
    if (mode === "near" && here) items.sort((a, b) => a.d - b.d);
    else items.sort((a, b) => (b.s.ready ? 1 : 0) - (a.s.ready ? 1 : 0));
    if (mode === "plan") $("listMsg").textContent = t("planMsg", { n: all.length, r: SPOTS.length });
    else $("listMsg").textContent = here ? t("nearMsg") : t("nearFinding");
    const box = $("spotList");
    box.innerHTML = "";
    const show = mode === "near" ? items.slice(0, 5) : items;
    show.forEach(({ s, d }) => {
      const it = document.createElement("div");
      it.className = "item" + (s.ready ? "" : " soon");
      const th = document.createElement("div"); th.className = "thumb";
      if (s.photo && s.photo.src) { const im = document.createElement("img"); im.src = s.photo.thumb || s.photo.src; im.alt = ""; im.loading = "lazy"; th.append(im); }
      const tx = document.createElement("div");
      const b = document.createElement("b"); b.textContent = pick(s.name, s.nameEn);
      const sp = document.createElement("span");
      const tag = document.createElement("i"); tag.className = "tag"; tag.textContent = s.ready ? t("ready") : t("soonTag");
      sp.append(tag);
      if (d !== null) sp.append(t("away", { m: fmt(d), t: Math.max(1, Math.round(d / 80)) }));
      tx.append(b, sp);
      if (s.photo) {   // 写真の出典（出典表示が必要な写真があるため一覧にも出す）
        const cr = document.createElement("span");
        cr.style.display = "block"; cr.style.fontSize = "11px";
        cr.textContent = pick(s.photo.year, s.photo.yearEn) + " · " + pick(s.photo.holder, s.photo.holderEn) + " · " + s.photo.license;
        tx.append(cr);
        if (s.photos && s.photos.length > 1) {
          const more = document.createElement("span");
          more.style.display = "block"; more.style.fontSize = "11px";
          more.textContent = t("photoCount", { n: s.photos.length });
          tx.append(more);
        }
      }
      it.append(th, tx);
      it.addEventListener("click", () => chooseSpot(s));
      box.append(it);
    });
  }
  function setMode(m) {
    mode = m;
    $("modePlan").classList.toggle("on", m === "plan");
    $("modeNear").classList.toggle("on", m === "near");
    if (m === "near") {
      startLocation();
      if (map && here) fitNear();
    } else if (map) {
      const all = SPOTS.concat(SOON).map((s) => [s.target.lat, s.target.lon]);
      if (all.length > 1) map.fitBounds(all, { padding: [30, 30], maxZoom: 15 }); else map.setView(all[0], 14);
    }
    renderList();
  }
  // 近くにある？：自分と近い3か所が入るように地図を合わせる
  let fittedNear = false;
  function fitNear() {
    const near = SPOTS.concat(SOON).map((s) => ({ s, d: distanceM(here, s.target) })).sort((a, b) => a.d - b.d).slice(0, 3);
    const pts = [[here.lat, here.lon]].concat(near.map((x) => [x.s.target.lat, x.s.target.lon]));
    map.fitBounds(pts, { padding: [30, 30], maxZoom: 16 });
    fittedNear = true;
  }
  $("modePlan").addEventListener("click", () => setMode("plan"));
  $("modeNear").addEventListener("click", () => setMode("near"));
  function showYou() {
    if (!map || !here) return;
    if (!youMarker) youMarker = window.L.marker([here.lat, here.lon], { icon: dot("#3B82F6", 7), zIndexOffset: 1000 }).addTo(map);
    else youMarker.setLatLng([here.lat, here.lon]);
  }

  // ===== ① 立つ：案内の表示 =====
  function render() {
    if (!here) return;
    const n = pick(spot.name, spot.nameEn);
    const goal = dest(spot);
    const d = distanceM(here, goal);
    const b = bearing(here, goal);
    $("dist").textContent = fmt(d);
    const st = $("status");
    if (d <= HERE_M && !spot.standAt) {
      $("dirText").textContent = t("hereTargetDir");
      $("dirSub").textContent = t("faceSub");
      st.className = "here"; st.textContent = t("hereTarget", { n });
      rotateArrow(b);
    } else if (d <= HERE_M) {
      const face = bearing(spot.standAt, spot.target);
      $("dirText").textContent = t("face", { n, d: dirName(face) });
      $("dirSub").textContent = t("faceSub");
      st.className = "here"; st.textContent = t("here");
      rotateArrow(face);
    } else {
      $("dirText").textContent = t("go", { d: dirName(b), m: fmt(d) });
      $("dirSub").textContent = t("walk", { t: Math.max(1, Math.round(d / 80)) });
      if (d <= NEAR_M) { st.className = "near"; st.textContent = t(spot.standAt ? "near" : "nearTarget", { n }); }
      else { st.className = ""; st.textContent = ""; }
      rotateArrow(b);
    }
  }
  function rotateArrow(targetDeg) {
    const rel = heading === null ? targetDeg : (targetDeg - heading + 360) % 360;
    $("arrow").style.transform = "rotate(" + rel + "deg)";
  }

  function onPosition(pos) {
    here = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    count += 1;
    if (!first) first = here;
    maxDrift = Math.max(maxDrift, distanceM(first, here));
    render();
    showYou();
    if (mode === "near") { renderList(); if (map && !fittedNear) fitNear(); }
    $("acc").textContent = "± " + Math.round(pos.coords.accuracy) + " m";
    $("drift").textContent = Math.round(maxDrift) + " m";
    $("count").textContent = count;
    $("time").textContent = new Date(pos.timestamp).toLocaleTimeString(lang === "ja" ? "ja-JP" : "en-US");
    $("msg").classList.add("hidden");
  }
  function onError(err) {
    if (err.code === err.PERMISSION_DENIED) showMsg(t("errPerm"));
    else if (err.code === err.TIMEOUT) showMsg(t("errTimeout"));
    else showMsg(t("errOther") + "（" + err.message + "）");
  }

  // ===== 向き（コンパス）と傾き =====
  function onOrientation(e) {
    let h = null;
    if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;     // iPhone
    else if (e.absolute && typeof e.alpha === "number") h = (360 - e.alpha) % 360;   // Android
    if (h !== null) { heading = h; $("compass").textContent = Math.round(h) + "°（" + dirName(h) + "）"; }
    // 縦に持ってカメラを前に向けた時 beta≒90。上に向けると90より大きい
    if (typeof e.beta === "number") { pitch = e.beta - 90; $("tilt").textContent = Math.round(pitch) + "°"; }
    render();
    renderAim();
  }
  let compassStarted = false;
  async function startCompass() {
    if (compassStarted) return;
    compassStarted = true;
    try {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== "granted") { $("compass").textContent = "×"; return; }
      }
      window.addEventListener("deviceorientationabsolute", onOrientation);
      window.addEventListener("deviceorientation", onOrientation);
    } catch (e) { $("compass").textContent = "×"; }
  }

  // 覗く画面：古写真と同じ構図への合わせ方（向き・傾き）
  function renderAim() {
    const box = $("aim");
    if (!spot.aim) { box.textContent = t("noAim"); return; }
    if (heading === null && pitch === null) { box.textContent = t("noSensor"); return; }
    const parts = [];
    if (heading !== null) {
      const dh = angleDiff(spot.aim.heading, heading);
      parts.push(t("aimHead") + (Math.abs(dh) <= AIM_HEAD_OK ? '<b class="ok">' + t("ok") + "</b>" : "<b>" + (dh > 0 ? t("right") : t("left")) + "</b>"));
    }
    if (pitch !== null) {
      const dp = spot.aim.pitch - pitch;
      parts.push(t("aimTilt") + (Math.abs(dp) <= AIM_PITCH_OK ? '<b class="ok">' + t("ok") + "</b>" : "<b>" + (dp > 0 ? t("up") : t("down")) + "</b>"));
    }
    box.innerHTML = parts.join("<br>");
  }

  function startLocation() {
    if (!window.isSecureContext) { showMsg(t("errHttps")); return; }
    if (!("geolocation" in navigator)) { showMsg(t("errOther")); return; }
    if (watchId !== null) return;
    startCompass(); // ボタンを押した時に許可を求める（iPhoneの決まり）
    $("start").textContent = t("guiding");
    $("dirText").textContent = t("finding");
    watchId = navigator.geolocation.watchPosition(onPosition, onError, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  }
  $("start").addEventListener("click", startLocation);
  $("reset").addEventListener("click", () => { first = null; maxDrift = 0; $("drift").textContent = "0 m"; });

  // ===== ② 覗く =====
  let camStream = null;
  $("camStart").addEventListener("click", async () => {
    const msg = $("camMsg");
    msg.classList.add("hidden");
    startCompass(); // 覗く画面で向き・傾きの案内を出すため
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      msg.textContent = t("errHttps"); msg.classList.remove("hidden"); return;
    }
    try {
      if (!camStream) {
        camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
        $("cam").srcObject = camStream;
      }
      setBig("cam");
      renderAim();
      $("view").classList.remove("hidden");
      await $("cam").play();
    } catch (e) {
      camStream = null;
      msg.textContent = e.name === "NotAllowedError" ? t("errCam") : t("errCamOther") + "（" + e.name + "）";
      msg.classList.remove("hidden");
    }
  });
  function setBig(id) {
    const other = id === "cam" ? "pip" : "cam";
    $(id).className = "big";
    $(other).className = "small";
  }
  $("cam").addEventListener("click", () => { if ($("cam").className === "small") setBig("cam"); });
  $("pip").addEventListener("click", () => { if ($("pip").className === "small") setBig("pip"); });
  $("close").addEventListener("click", () => {
    $("view").classList.add("hidden");
    if (camStream) camStream.getTracks().forEach((tr) => tr.stop());
    camStream = null;
  });

  // ===== ③ 残す：昔と今を横に並べた1枚 =====
  // 古写真は切らず・加工せず左に。今の写真は同じ縦横比で右に。出典は写真の外の余白に書く。
  let shotBlob = null;
  function makeComparison() {
    const old = $("pip"), cam = $("cam"), p = spot.photo;
    const ratio = old.naturalWidth / old.naturalHeight;
    const H = 1200, W = Math.round(H * ratio);
    const pad = 40, gap = 24, top = 110, bottom = 130;
    const c = document.createElement("canvas");
    c.width = pad * 2 + W * 2 + gap;
    c.height = top + H + bottom;
    const x = c.getContext("2d");
    const font = "-apple-system, 'Hiragino Sans', sans-serif";
    x.fillStyle = "#F5F0E8"; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = "#3D5A80"; x.font = "bold 44px " + font;
    x.fillText("TimeWalk　" + pick(spot.name, spot.nameEn), pad, 62);
    x.fillStyle = "#8B6B4A"; x.font = "30px " + font;
    x.fillText(t("then") + "　" + pick(p.year, p.yearEn), pad, top - 14);
    x.fillText(t("now") + "　" + new Date().toLocaleDateString(lang === "ja" ? "ja-JP" : "en-US"), pad + W + gap, top - 14);
    x.drawImage(old, pad, top, W, H);
    const vw = cam.videoWidth, vh = cam.videoHeight;
    let sw = vw, sh = vw / ratio;
    if (sh > vh) { sh = vh; sw = vh * ratio; }
    x.drawImage(cam, (vw - sw) / 2, (vh - sh) / 2, sw, sh, pad + W + gap, top, W, H);
    // 出典は写真の外（下の余白）に、幅に合わせて折り返して書く
    x.font = "24px " + font;
    const maxW = c.width - pad * 2;
    const lines = [];
    const wrap = (text) => {
      let line = "";
      for (const ch of text) {
        if (x.measureText(line + ch).width > maxW) { lines.push(line); line = ch; } else line += ch;
      }
      if (line) lines.push(line);
    };
    wrap("昔の写真：" + (p.credit || (p.title + " " + p.year + (p.by ? "・" + p.by : "") + "・" + p.holder + (p.id ? "（" + p.id + "）" : "")) ) + "・" + p.license);
    wrap("Old photo: " + (p.titleEn || p.title) + ", " + (p.yearEn || p.year) + ", " + (p.holderEn || p.holder) + " (" + p.license + ")");
    const need = top + H + 30 + lines.length * 36 + 20;
    if (need > c.height) {   // 出典が長い時は下の余白を広げて描き直す
      const img = x.getImageData(0, 0, c.width, top + H);
      c.height = need;
      x.fillStyle = "#F5F0E8"; x.fillRect(0, 0, c.width, c.height);
      x.putImageData(img, 0, 0);
      x.font = "24px " + font;
    }
    x.fillStyle = "#6B6B6B";
    lines.forEach((ln, i) => x.fillText(ln, pad, top + H + 50 + i * 36));
    return c;
  }
  $("shutter").addEventListener("click", () => {
    if (!camStream || !$("cam").videoWidth) return;
    const c = makeComparison();
    $("shotImg").src = c.toDataURL("image/jpeg", 0.9);
    c.toBlob((b) => { shotBlob = b; }, "image/jpeg", 0.9);
    $("saveHint").classList.add("hidden");
    $("shot").classList.remove("hidden");
  });
  $("retake").addEventListener("click", () => { $("shot").classList.add("hidden"); });
  $("saveBtn").addEventListener("click", async () => {
    if (!shotBlob) return;
    const name = "timewalk-" + spot.id + "-" + new Date().toISOString().slice(0, 10) + ".jpg";
    const file = new File([shotBlob], name, { type: "image/jpeg" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "TimeWalk" });
        return;
      }
    } catch (e) { if (e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(shotBlob); a.download = name; a.click();
    $("saveHint").classList.remove("hidden");
  });

  // ===== はじめに =====
  initMap();
  applyLang();
</script>
</body>
</html>
